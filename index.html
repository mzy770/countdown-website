<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e7eef6"><title>临界 · AETHER</title><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<header><a class="brand" href="./" aria-label="临界首页"><span class="brand-icon">◇</span> AETHER <span class="brand-cn">临界</span></a><button id="sound" class="small-button" aria-pressed="false" aria-label="开启音效"><span>◖))</span><span id="sound-label">声音关闭</span></button></header>
<main>
<div class="eyebrow"><i></i> A MOMENT WORTH WAITING FOR</div>
<section class="projection" aria-label="重要日期倒计时">
<div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
<div class="holo-panel"><div class="panel-top"><span>TIME / CONTINUUM</span><span class="signal">● ● ● <b>LIVE</b></span></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="countdown" id="countdown" role="timer" aria-label="剩余时间"><div class="time-block day-block"><span class="number" id="days">000</span><span class="unit">DAYS / 天</span></div><span class="divider">:</span><div class="time-block"><span class="number" id="hours">00</span><span class="unit">HOURS / 时</span></div><span class="divider">:</span><div class="time-block"><span class="number" id="minutes">00</span><span class="unit">MINUTES / 分</span></div><span class="divider">:</span><div class="time-block"><span class="number" id="seconds">00</span><span class="unit">SECONDS / 秒</span></div></div>
<div class="panel-bottom"><span id="status">未来，正在靠近</span><span class="ticks">╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵╵</span><span>SYNC / 01</span></div><div class="scan"></div></div>
<button class="date-trigger" id="edit-date"><span id="event-name">下一个重要时刻</span><span class="date-line"><span id="target-label"></span><span class="edit-icon">↗</span></span></button>
<div class="platform"><div></div><div></div><div></div><span class="beam"></span></div>
</section>
</main>
<footer><span class="footer-note">让每一秒，都有意义。</span><button class="task-trigger" id="open-tasks">待完成事项 <span id="task-count">0</span><span>↗</span></button><span class="coordinates">EST. NOW &nbsp; / &nbsp; ∞ POSSIBILITIES</span></footer>
<dialog id="date-dialog"><form id="date-form"><div class="dialog-heading"><span>设定一个值得等待的时刻</span><button type="button" class="close" data-close="date-dialog" aria-label="关闭日期设置">×</button></div><label>时刻名称<input id="event-input" maxlength="40" placeholder="例如：启程的那一天" required></label><label>目标日期与时间<input id="date-input" type="datetime-local" required></label><p class="hint">按当前设备的本地时区计算。设置会保存在此浏览器。</p><button type="submit" class="primary">让未来开始倒数 <span>↗</span></button></form></dialog>
<dialog id="task-dialog"><div class="dialog-heading"><span>抵达之前</span><button class="close" data-close="task-dialog" aria-label="关闭待办">×</button></div><p class="hint">完成一件事，让它化作光。</p><form id="task-form"><input id="task-input" maxlength="100" placeholder="还有什么想完成？" aria-label="新待办事项" required><button class="add-button" aria-label="添加事项">+</button></form><ul id="task-list"></ul><p id="empty-tasks">留一点空间，给下一件值得做的事。</p></dialog>
<div id="announcement" class="sr-only" aria-live="polite"></div><script src="app.js"></script>
</body></html>
